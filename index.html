
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="./styles.css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Массив от пользователя</title>
</head>
<body>
    <div class="container">
        <h1>registration form</h1>
        <form class="registrationForm" action="/signup" method="get">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="surname">Surname:</label>
            <input type="text" id="surname" name="surname" required>

            <label>Gender:</label>
            <div class="genderForm">
                <input type="radio" name="gender" id="male" value="Male">
                <label for="male">Male</label>

                <input type="radio" name="gender" id="female" value="Female">
                <label for="female">Female</label>
            </div>

            <div class="birthday">
                <label for="birthday">Write ur birthday</label>
                <input type="date" id="birthday" name="birthday" required>
            </div>

            <label for="city">City:</label>
            <select name="city" id="city">
                <option value="Dnipro">Dnipro</option>
                <option value="Odesa">Odesa</option>
                <option value="Kharkiv">Kharkiv</option>
            </select>


            <label for="adress">Adress:</label>
            <textarea name="adress" id="adress" rows="3"></textarea>

            <label>Languages:</label>
            <div class="checkbox-group">
            <input type="checkbox" name="languages" value="Ukrainian" id="ukrainian">
            <label for="ukrainian">Ukrainian</label>

            <input type="checkbox" name="languages" value="English" id="english">
            <label for="english">English</label>

            <input type="checkbox" name="languages" value="German" id="german">
            <label for="german">German</label>
            </div>

            <label for="email">Emale:</label>
            <input type="email" name="email" id="email" required>

            <button class="submitbtn">Submit</button>
        </form>
    </div>  
    <script src="index.js"></script>
</body>
</html>
