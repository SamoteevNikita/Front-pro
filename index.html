
<!DOCTYPE html>
<html lang="ru">
<head>
    <link rel="stylesheet" href="./styles.css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Массив от пользователя</title>
</head>
<body>
    <h1>Пользователи</h1>

    <div id="users" class="user-list"></div>
    <button onclick="showForm()">Добавить пользователя</button>
    <div id="form-container" class="form-container">
        <h2 id="form-title">Додати користувача</h2>
        <input type="hidden" id="userId">
        <input type="text" id="name" placeholder="Ім'я">
        <input type="email" id="email" placeholder="Email">
        <button onclick="saveUser()">Зберегти</button>
        <button onclick="hideForm()">Скасувати</button>
    </div>
    <script src="index.js"></script>
</body>
</html>
