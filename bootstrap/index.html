<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./node_modules/bootstrap/dist/css/bootstrap.min.css">
</head>
<body>

<div id="liveAlertPlaceholder"></div>


<button 
  type="button" 
  class="btn btn-primary" 
  data-bs-toggle="modal" 
  data-bs-target="#exampleModal" 
  title="Натисни мене для відкриття модалки" 
  data-bs-placement="top" 
  data-bs-toggle="tooltip">
    Launch demo modal
</button>

<div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        вот модалка
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>


<button type="button" class="btn btn-primary" id="liveAlertBtn">День рождения</button>


<div class="container mt-5">
    <div class="input-group mb-3">
      <span class="input-group-text">Введіть дату вашого народження</span>
      <div class="form-floating">
        <input type="text" class="form-control" id="birthdayInput" placeholder="Username">
        <label for="birthdayInput">Наприклад 01102007</label>
      </div>
      <input class="btn btn-primary" type="submit" value="Submit" id="submitBtn">
    </div>

    <div id="result" class="mt-3 fw-bold"></div>

    <div id="error" class="invalid-feedback">Невірний формат. Введіть дату у форматі ДДММРРРР (наприклад, 01102007)</div>
  </div>


<script src="./node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
<script src="./node_modules/moment/min/moment.min.js"></script>
<script src="./node_modules/moment/locale/uk.js"></script>


<script>
  const input = document.getElementById('birthdayInput');
  const button = document.getElementById('submitBtn');
  const result = document.getElementById('result');
  const error = document.getElementById('error')

  moment.locale('uk');

  button.addEventListener('click', () => {
    const value = input.value.trim();
    const date = moment(value, 'DDMMYYYY', true);

    if (!date.isValid()) {
      input.classList.add('is-invalid');
      result.textContent = '';
      error.style.display = 'block'
      return;
    }

    input.classList.remove('is-invalid');
    error.style.display = 'none'
    result.textContent = `Ваша дата у новому форматі: ${date.format('ll')}`;
    result.classList.add('text-success');
  });
</script>


<script>

 
  const alertPlaceholder = document.getElementById('liveAlertPlaceholder');
  const alertTrigger = document.getElementById('liveAlertBtn');

  const appendAlert = (message, type) => {
    const wrapper = document.createElement('div');
    wrapper.innerHTML = [
      `<div class="alert alert-${type} alert-dismissible" role="alert">`,
      `   <div>${message}</div>`,
      '   <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>',
      '</div>'
    ].join('');
    alertPlaceholder.append(wrapper);
  };


  let alertVisible = false; 
  alertTrigger.addEventListener('click', () => {
    if (alertVisible) {
      
      const alert = alertPlaceholder.querySelector('.alert');
      if (alert) {
        alert.remove();
      }
      alertVisible = false;
    } else {
      
      let myBirthday = moment('2007-10-01'); 
      appendAlert(myBirthday.format('D MMMM YYYY'), 'success')
      alertVisible = true;
    }
  });

  
</script>

</body>
</html>
